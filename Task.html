<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tester Status Dashboard</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    margin: 0;
}

header {
    background: #2c3e50;
    color: white;
    padding: 14px;
    text-align: center;
    font-size: 20px;
}

#lastUpdate {
    text-align: center;
    font-size: 13px;
    color: #555;
    margin: 6px 0;
}

/* SEARCH */
.search {
    text-align: center;
    margin: 10px;
}
.search input {
    padding: 6px 10px;
    width: 220px;
}

/* TABLE */
table {
    width: 95%;
    margin: 10px auto;
    border-collapse: collapse;
    background: white;
}

th, td {
    padding: 8px;
    border: 1px solid #ddd;
    text-align: center;
    font-size: 14px;
}

th {
    background: #34495e;
    color: white;
    cursor: pointer;
    position: sticky;
    top: 0;
}

.pending { color: #e67e22; font-weight: bold; }
.progress { color: #2980b9; font-weight: bold; }
.completed { color: #27ae60; font-weight: bold; }

.danger { background: #ffe5e5; }
.topper { background: #e8f8f5; }

tfoot td {
    font-weight: bold;
    background: #ecf0f1;
}

footer {
    text-align: center;
    font-size: 12px;
    color: #777;
    padding: 10px;
}
</style>
</head>

<body>

<header>Tester Patch Status Dashboard</header>
<div id="lastUpdate">Last updated: --</div>

<!-- Search -->
<div class="search">
    <input type="text" id="searchBox" placeholder="Search tester..." onkeyup="filterTable()">
</div>

<table id="mainTable">
<thead>
<tr>
    <th onclick="sortTable(0)">Tester</th>
    <th onclick="sortTable(1)">Pending</th>
    <th onclick="sortTable(2)">In Progress</th>
    <th onclick="sortTable(3)">Completed</th>
    <th>Total</th>
    <th>% Completed</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
<tfoot>
<tr>
    <td>GRAND TOTAL</td>
    <td id="gPending">0</td>
    <td id="gProgress">0</td>
    <td id="gCompleted">0</td>
    <td id="gTotal">0</td>
    <td id="gPercent">0%</td>
</tr>
</tfoot>
</table>

<footer>Live Google Sheet | Auto Refresh</footer>

<script>
const SHEET_ID = "11umteDx8Ejkjk4kn1rQz8-9c0UMALgG5uSk7Evgy6Ow";
const SHEET_NAME = "Sheet1";
const REFRESH = 30000;
const PENDING_ALERT = 10;

let currentSortCol = 0;
let sortAsc = true;

function normalize(v){ return v.toString().trim().toLowerCase(); }

function normalizeStatus(s){
    s = normalize(s);
    if(s==="pending") return "Pending";
    if(s==="in progress"||s==="in-progress") return "In Progress";
    if(s==="completed") return "Completed";
    return null;
}

function formatName(n){ return n.charAt(0).toUpperCase()+n.slice(1); }

function loadData(){
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}`;
    fetch(url)
    .then(r=>r.text())
    .then(t=>{
        const json = JSON.parse(t.substring(t.indexOf("{"), t.lastIndexOf("}")+1));
        const rows = json.table.rows;
        const testers={};
        let gP=0,gIP=0,gC=0;

        rows.forEach(r=>{
            let tester=r.c[3]?.v;
            let status=r.c[1]?.v;
            if(!tester||!status) return;

            const key=normalize(tester);
            const st=normalizeStatus(status);
            if(!st) return;

            if(!testers[key]){
                testers[key]={name:formatName(key),Pending:0,"In Progress":0,Completed:0};
            }
            testers[key][st]++;
            if(st==="Pending") gP++;
            if(st==="In Progress") gIP++;
            if(st==="Completed") gC++;
        });

        render(testers,gP,gIP,gC);
        document.getElementById("lastUpdate").innerText =
            "Last updated: "+new Date().toLocaleTimeString();
    });
}

function render(data,gP,gIP,gC){
    const tbody=document.getElementById("tableBody");
    tbody.innerHTML="";
    let maxPending=0,topKey="";

    Object.values(data).forEach(d=>{
        if(d.Pending>maxPending){maxPending=d.Pending;topKey=d.name;}
    });

    Object.keys(data).sort().forEach(k=>{
        const d=data[k];
        const total=d.Pending+d["In Progress"]+d.Completed;
        const percent=total?Math.round((d.Completed/total)*100):0;
        const tr=document.createElement("tr");
        if(d.Pending>PENDING_ALERT) tr.classList.add("danger");
        if(d.name===topKey) tr.classList.add("topper");

        tr.innerHTML=`
        <td>${d.name}</td>
        <td class="pending">${d.Pending}</td>
        <td class="progress">${d["In Progress"]}</td>
        <td class="completed">${d.Completed}</td>
        <td>${total}</td>
        <td>${percent}%</td>`;
        tbody.appendChild(tr);
    });

    document.getElementById("gPending").innerText=gP;
    document.getElementById("gProgress").innerText=gIP;
    document.getElementById("gCompleted").innerText=gC;
    document.getElementById("gTotal").innerText=gP+gIP+gC;
    document.getElementById("gPercent").innerText=
        (gC?Math.round((gC/(gP+gIP+gC))*100):0)+"%";
}

function filterTable(){
    const q=document.getElementById("searchBox").value.toLowerCase();
    document.querySelectorAll("#tableBody tr").forEach(r=>{
        r.style.display=r.cells[0].innerText.toLowerCase().includes(q)?"":"none";
    });
}

function sortTable(col){
    const table=document.getElementById("mainTable");
    const rows=[...table.tBodies[0].rows];
    sortAsc = col===currentSortCol ? !sortAsc : true;
    currentSortCol=col;

    rows.sort((a,b)=>{
        let x=a.cells[col].innerText.replace('%','');
        let y=b.cells[col].innerText.replace('%','');
        return sortAsc ? x-y || x.localeCompare(y) : y-x || y.localeCompare(x);
    });
    rows.forEach(r=>table.tBodies[0].appendChild(r));
}

loadData();
setInterval(loadData,REFRESH);
</script>

</body>
</html>
