<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tester Status Dashboard</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    margin: 0;
}

header {
    background: #2c3e50;
    color: white;
    padding: 14px;
    text-align: center;
    font-size: 20px;
}

#lastUpdate {
    text-align: center;
    font-size: 13px;
    color: #555;
    margin: 8px 0;
}

table {
    width: 85%;
    margin: 20px auto;
    border-collapse: collapse;
    background: white;
    box-shadow: 0 6px 16px rgba(0,0,0,0.08);
}

th, td {
    padding: 10px;
    border: 1px solid #ddd;
    text-align: center;
    font-size: 14px;
}

th {
    background: #34495e;
    color: white;
}

.pending { color: #e67e22; font-weight: bold; }
.progress { color: #2980b9; font-weight: bold; }
.completed { color: #27ae60; font-weight: bold; }

footer {
    text-align: center;
    font-size: 12px;
    color: #777;
    padding-bottom: 12px;
}
</style>
</head>

<body>

<header>Tester Patch Status – Table View</header>
<div id="lastUpdate">Last updated: --</div>

<table>
    <thead>
        <tr>
            <th>Tester</th>
            <th>Pending</th>
            <th>In Progress</th>
            <th>Completed</th>
            <th>Total</th>
        </tr>
    </thead>
    <tbody id="tableBody"></tbody>
</table>

<footer>Live Google Sheet | Auto Refresh</footer>

<script>
/* ===============================
   GOOGLE SHEET CONFIG
================================ */
const SHEET_ID = "11umteDx8Ejkjk4kn1rQz8-9c0UMALgG5uSk7Evgy6Ow";
const SHEET_NAME = "Sheet1";
const REFRESH_INTERVAL = 30000; // 30 seconds

function loadSheetData() {
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}`;

    fetch(url)
        .then(res => res.text())
        .then(text => {
            // remove Google JSON wrapper
            const json = JSON.parse(text.substring(text.indexOf("{"), text.lastIndexOf("}") + 1));
            const rows = json.table.rows;

            const testers = {};

            rows.forEach(r => {
                const tester = r.c[3]?.v;
                let status = r.c[1]?.v;

                if (!tester || !status) return;

                // 🔧 NORMALIZE STATUS
                status = status.toString().trim().toLowerCase();

                if (!testers[tester]) {
                    testers[tester] = { Pending: 0, "In Progress": 0, Completed: 0 };
                }

                if (status === "pending") {
                    testers[tester].Pending++;
                }
                else if (status === "in progress" || status === "in-progress") {
                    testers[tester]["In Progress"]++;
                }
                else if (status === "completed") {
                    testers[tester].Completed++;
                }
            });

            renderTable(testers);

            document.getElementById("lastUpdate").innerText =
                "Last updated: " + new Date().toLocaleTimeString();
        })
        .catch(err => console.error("Sheet error:", err));
}

function renderTable(data) {
    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";

    Object.keys(data).sort().forEach(tester => {
        const d = data[tester];
        const total = d.Pending + d["In Progress"] + d.Completed;

        tbody.innerHTML += `
        <tr>
            <td>${tester}</td>
            <td class="pending">${d.Pending}</td>
            <td class="progress">${d["In Progress"]}</td>
            <td class="completed">${d.Completed}</td>
            <td><b>${total}</b></td>
        </tr>`;
    });
}

// initial load
loadSheetData();

// auto refresh
setInterval(loadSheetData, REFRESH_INTERVAL);
</script>

</body>
</html>
