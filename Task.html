<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tester Status Dashboard</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    margin: 0;
}

header {
    background: #2c3e50;
    color: white;
    padding: 14px;
    text-align: center;
    font-size: 20px;
}

#topBar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 16px;
    background: #eef2f6;
    border-bottom: 1px solid #ccc;
    font-size: 13px;
}

button {
    padding: 6px 12px;
    cursor: pointer;
    border: 1px solid #2c3e50;
    background: #2c3e50;
    color: white;
    border-radius: 4px;
}

/* SEARCH */
.search {
    text-align: center;
    margin: 10px;
}
.search input {
    padding: 6px 10px;
    width: 220px;
}

/* TABLE */
table {
    width: 95%;
    margin: 10px auto;
    border-collapse: collapse;
    background: white;
}

th, td {
    padding: 8px;
    border: 1px solid #ddd;
    text-align: center;
    font-size: 14px;
}

th {
    background: #34495e;
    color: white;
    position: sticky;
    top: 0;
}

tbody tr:nth-child(even) {
    background: #f8f9fb;
}

.tester-link {
    color: #2c3e50;
    font-weight: bold;
    cursor: pointer;
    text-decoration: underline;
}

/* STATUS COLORS */
.pending { color: #e67e22; font-weight: bold; }
.progress { color: #2980b9; font-weight: bold; }
.completed { color: #27ae60; font-weight: bold; }

/* PREVIEW */
#preview {
    width: 95%;
    margin: 15px auto;
    background: white;
    border: 1px solid #ccc;
    border-radius: 4px;
    padding: 12px;
}

#preview .tester-name {
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 6px;
    color: #2c3e50;
    background: cyan;
}

.preview-section {
    margin-top: 10px;
}

.preview-section h4 {
    margin-bottom: 4px;
    font-size: 14px;
}

.preview-section ol {
    padding-left: 22px;
    font-size: 13px;
}

.preview-section li {
    margin-bottom: 3px;
}

/* FOOTER */
tfoot td {
    font-weight: bold;
    background: #ecf0f1;
}

footer {
    text-align: center;
    font-size: 12px;
    color: #777;
    padding: 10px;
}
</style>
</head>

<body>

<header>Tester Patch Status</header>

<div id="topBar">
    <div id="lastUpdate">Last updated: --</div>
    <button onclick="loadData()">Refresh</button>
</div>

<div class="search">
    <input type="text" id="searchBox" placeholder="Search tester..." onkeyup="filterTable()">
</div>

<table>
<thead>
<tr>
    <th>Tester</th>
    <th>Pending</th>
    <th>In Progress</th>
    <th>Completed</th>
    <th>Total</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
<tfoot>
<tr>
    <td>GRAND TOTAL</td>
    <td id="gPending">0</td>
    <td id="gProgress">0</td>
    <td id="gCompleted">0</td>
    <td id="gTotal">0</td>
</tr>
</tfoot>
</table>

<!-- PREVIEW -->
<div id="preview">
    <div id="previewContent">
        Click a tester name to view pending and in-progress patches.
    </div>
</div>


<script>
const SHEET_ID = "11umteDx8Ejkjk4kn1rQz8-9c0UMALgG5uSk7Evgy6Ow";
const SHEET_NAME = "Sheet1";

let patchStore = {};

function normalize(v){ return v.toString().trim().toLowerCase(); }

function normalizeStatus(s){
    s = normalize(s);
    if (s === "pending") return "Pending";
    if (s === "in progress" || s === "in-progress") return "In Progress";
    if (s === "completed") return "Completed";
    return null;
}

function formatName(n){
    return n.charAt(0).toUpperCase() + n.slice(1);
}

function loadData(){
    document.getElementById("previewContent").innerHTML =
        "Click a tester name to view pending and in-progress patches.";

    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}`;
    fetch(url)
        .then(r => r.text())
        .then(txt => {
            const json = JSON.parse(txt.substring(txt.indexOf("{"), txt.lastIndexOf("}") + 1));
            const rows = json.table.rows;

            const testers = {};
            patchStore = {};
            let gP=0, gIP=0, gC=0;

            rows.forEach(r => {
                const patch = r.c[0]?.v;
                const statusRaw = r.c[1]?.v;
                const testerRaw = r.c[3]?.v;
                if (!patch || !statusRaw || !testerRaw) return;

                const testerKey = normalize(testerRaw);
                const status = normalizeStatus(statusRaw);
                if (!status) return;

                if (!testers[testerKey]) {
                    testers[testerKey] = {
                        name: formatName(testerKey),
                        Pending: 0,
                        "In Progress": 0,
                        Completed: 0
                    };
                    patchStore[testerKey] = {
                        Pending: [],
                        "In Progress": [],
                        Completed: []
                    };
                }

                testers[testerKey][status]++;
                patchStore[testerKey][status].push(patch);

                if (status === "Pending") gP++;
                if (status === "In Progress") gIP++;
                if (status === "Completed") gC++;
            });

            renderTable(testers);
            updateTotals(gP, gIP, gC);

            document.getElementById("lastUpdate").innerText =
                "Last updated: " + new Date().toLocaleTimeString();
        });
}

function renderTable(data){
    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";

    Object.keys(data).sort().forEach(k => {
        const d = data[k];
        const total = d.Pending + d["In Progress"] + d.Completed;

        tbody.innerHTML += `
        <tr>
            <td class="tester-link" onclick="showTester('${k}')">${d.name}</td>
            <td class="pending">${d.Pending}</td>
            <td class="progress">${d["In Progress"]}</td>
            <td class="completed">${d.Completed}</td>
            <td>${total}</td>
        </tr>`;
    });
}

function showTester(testerKey){
    const p = patchStore[testerKey];

    document.getElementById("previewContent").innerHTML = `
        <div class="tester-name">${formatName(testerKey)}</div>

        <div class="preview-section">
            <h4 class="pending">Pending (${p.Pending.length})</h4>
            <ol>${p.Pending.map(x => `<li>${x}</li>`).join("") || "<li>None</li>"}</ol>
        </div>

        <div class="preview-section">
            <h4 class="progress">In Progress (${p["In Progress"].length})</h4>
            <ol>${p["In Progress"].map(x => `<li>${x}</li>`).join("") || "<li>None</li>"}</ol>
        </div>
    `;
}

function updateTotals(p, ip, c){
    document.getElementById("gPending").innerText = p;
    document.getElementById("gProgress").innerText = ip;
    document.getElementById("gCompleted").innerText = c;
    document.getElementById("gTotal").innerText = p + ip + c;
}

function filterTable(){
    const q = document.getElementById("searchBox").value.toLowerCase();
    document.querySelectorAll("#tableBody tr").forEach(r=>{
        r.style.display = r.cells[0].innerText.toLowerCase().includes(q) ? "" : "none";
    });
}

/* INIT */
loadData();
</script>

</body>
</html>
