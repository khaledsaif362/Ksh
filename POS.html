<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Position Files</title>

    <link rel="stylesheet" href="style.css">

    <!-- =========================
         PAGE-SCOPED FIXES
         (this page only — STYLE.css
         is shared, so these are not
         edited there)

         1) STYLE.css sets
            html, body { overflow:hidden; height:100% }
            which clips anything taller than the
            viewport instead of scrolling — restored
            to normal scrolling here.

         2) STYLE.css's .window rule uses a fixed
            438px width with a -200px right margin,
            which pushes the title bar outside the
            400px-wide .card. Neutralised here so
            the title bar stays inside the card at
            any zoom level.
    ========================== -->

    <style>

        html, body {
            overflow: auto !important;
            height: auto !important;
            min-height: 100%;
            width: 100% !important;
        }

        /*
         * Force the card to fit the actual screen
         * regardless of how wide the surrounding page
         * / iframe is set up. min() caps it at 480px
         * on desktop but never exceeds 94% of the
         * real viewport on a phone.
         */

        .card {
            position: relative;
            width: min(94vw, 480px) !important;
            max-width: min(94vw, 480px) !important;
            margin: 16px auto !important;
            box-sizing: border-box !important;
        }

        .card * {
            box-sizing: border-box !important;
            max-width: 100%;
        }

        .window {
            width: 100% !important;
            margin: 0 0 12px 0 !important;
            background-color: transparent !important;
            box-shadow: none !important;
            border: none !important;
        }

        .title-bar {
            padding: 6px 10px !important;
            font-size: 13px !important;
            border-radius: 8px !important;
        }

        /*
         * Tabs — all 5 segments in a single row,
         * sized down to fit a phone screen instead
         * of wrapping onto a second line.
         */

        .tab-bar {
            display: flex !important;
            flex-wrap: nowrap !important;
            gap: 3px !important;
        }

        .tab {
            flex: 1 1 0 !important;
            width: auto !important;
            min-width: 0 !important;
            height: 32px !important;
            font-size: 10.5px !important;
            padding: 0 2px !important;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /*
         * Client ID / expiry rows — label and input
         * back on one line, side by side.
         */

        .form-row {
            display: flex !important;
            flex-direction: row !important;
            align-items: center !important;
            gap: 8px !important;
            margin-bottom: 8px !important;
        }

        .form-row label {
            flex: 0 0 100px !important;
            width: 100px !important;
            margin: 0 !important;
            font-size: 12px !important;
        }

        .form-row input,
        .form-row select {
            flex: 1 !important;
            min-width: 0 !important;
            height: 30px !important;
            font-size: 12px !important;
        }

        /* compact FO file checkboxes —
           short labels (ICCL CM etc.) laid out
           side by side instead of one per line */

        #checkboxContainer {
            display: flex !important;
            flex-wrap: wrap !important;
            gap: 4px 14px !important;
            padding: 8px !important;
            max-height: none !important;
        }

        #checkboxContainer .checkbox-item {
            flex: 0 0 auto;
            margin-bottom: 2px !important;
        }

        #checkboxContainer .checkbox-item label {
            font-size: 12px !important;
        }

        #checkboxContainer .checkbox-item input[type="checkbox"] {
            width: 15px !important;
            height: 15px !important;
        }

    </style>


    <!-- =========================
         MANUAL SCRIP STYLES
         side panel — sits in the empty
         margin beside the card, does not
         cover the page
    ========================== -->

    <style>

        /* trigger strip left in the main card —
           also the anchor point the popup opens
           against */

        .manual-section {
            margin: 8px 0;
            padding: 5px 7px;
            border: 1px solid #c9c9c9;
            border-radius: 5px;
            font-size: 11px;
        }

        .manual-head {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .manual-head strong {
            font-size: 12px;
            flex: 1;
        }

        .manual-section button,
        .manual-drawer button {
            font-size: 12px !important;
            padding: 3px 9px !important;
            width: auto !important;
            min-width: 0 !important;
            height: auto !important;
            margin: 0 !important;
            line-height: 1.4 !important;
            cursor: pointer;
        }

        .manual-count {
            font-size: 10px;
            color: #555;
        }

        /* popup: covers the full form (the whole
           card) in place, sized to match the card's
           own box — not vh-based, so it can't be cut
           off by an outer iframe with a fixed height */

        .manual-drawer {
            display: none;
            position: absolute;
            inset: 0;
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
            z-index: 50;
            flex-direction: column;
            overflow: hidden;
        }

        .manual-drawer.open {
            display: flex;
        }

        .manual-drawer-head {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            border-bottom: 1px solid #ddd;
        }

        .manual-drawer-head strong {
            font-size: 14px;
            flex: 1;
        }

        .manual-drawer-body {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            padding: 10px 12px;
        }

        .manual-notice {
            font-size: 11px;
            color: #8a4b00;
            background: #fff4e0;
            border: 1px solid #f0d3a0;
            border-radius: 3px;
            padding: 4px 7px;
            margin-bottom: 10px;
        }

        /* one card per scrip, fields wrap freely,
           comfortable size, no forced single line */

        .manual-row {
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 8px;
            margin-bottom: 8px;
        }

        .manual-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .manual-field {
            display: flex;
            flex-direction: column;
            flex: 1 1 90px;
        }

        .manual-field label {
            font-size: 11px;
            color: #555;
            margin-bottom: 2px;
            white-space: nowrap;
        }

        .manual-field input,
        .manual-field select {
            width: 100% !important;
            min-width: 0 !important;
            height: 28px !important;
            font-size: 13px !important;
            padding: 3px 5px !important;
            margin: 0 !important;
            box-sizing: border-box !important;
        }

        .manual-row-foot {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 6px;
        }

    </style>

</head>

<body>

<div class="card">

    <div class="window">
        <div class="title-bar">
            Position Files
        </div>
    </div>


    <!-- =========================
         SEGMENT TABS
    ========================== -->

    <div class="tab-bar" role="tablist">

        <button class="tab active"
                onclick="changeTab('FO',this)">
            FO
        </button>

        <button class="tab"
                onclick="changeTab('CD',this)">
            CD
        </button>

        <button class="tab"
                onclick="changeTab('MCX',this)">
            MCX
        </button>

        <button class="tab"
                onclick="changeTab('NCDEX',this)">
            NCDEX
        </button>

        <button class="tab"
                onclick="changeTab('NSECOM',this)">
            NSECOM
        </button>

    </div>


    <input type="hidden"
           id="positionType"
           value="FO">


    <!-- =========================
         CLIENT 1
    ========================== -->

    <div class="form-row">

        <label>
            Client ID 1
        </label>

        <input type="text"
               id="client1">

    </div>


    <!-- =========================
         CLIENT 2
    ========================== -->

    <div class="form-row">

        <label>
            Client ID 2
        </label>

        <input type="text"
               id="client2">

    </div>


    <!-- =========================
         NSE EXPIRY
    ========================== -->

    <div class="form-row"
         id="commonExpiryRow">

        <label for="expiry"
               style="width:230px; white-space:nowrap;">

            NSE Expiry

        </label>

        <input type="date"
               id="expiry">

    </div>


    <!-- =========================
         BSE EXPIRY
    ========================== -->

    <div class="form-row"
         id="sensexBankexExpiryRow">

        <label for="sensexBankexExpiry"
               style="width:230px; white-space:nowrap;">

            BSE Expiry

        </label>

        <input type="date"
               id="sensexBankexExpiry">

    </div>


    


    <!-- =========================
         SYMBOL EXPIRY
         MCX / CD / NCDEX / NSECOM
    ========================== -->

    <div id="symbolExpiryContainer"
         style="display:none;">
    </div>






<!-- =========================
         ADDITIONAL STRIKES
         FO + MCX
    ========================== -->

    <div class="form-row"
         id="additionalStrikeRow">

        <label for="additionalStrikes"
               style="width:230px; white-space:nowrap;">

            Additional Strikes

        </label>

        <input type="number"
               id="additionalStrikes"
               min="0"
               value="0">

    </div>







    <!-- =========================
         MANUAL SCRIP ENTRY
         (trigger strip only — clicking Open
          drops a popup directly onto the form
          below it, with a row ready to fill in)
    ========================== -->

    <div class="manual-section" id="manualSection">

        <div class="manual-head">

            <strong>
                Manual Scrips
            </strong>

            <span class="manual-count" id="manualCount">
            </span>

            <button type="button"
                    onclick="openManualPanel()">
                Open
            </button>

        </div>


        <!-- =========================
             MANUAL SCRIP POPUP
        ========================== -->

        <div class="manual-drawer" id="manualDrawer">

            <div class="manual-drawer-head">

                <strong>
                    Manual Scrips
                </strong>

                <button type="button"
                        onclick="closeManualDrawer()">
                    Close
                </button>

            </div>

            <div class="manual-drawer-body">

                <div class="manual-notice"
                     id="manualNotice"
                     style="display:none;">

                    Manual mode ON — only the scrips below are written.

                </div>

                <div id="manualContainer">
                </div>

            </div>

        </div>

    </div>


    <!-- =========================
         FO FILE CHECKBOXES
    ========================== -->

    <div id="checkboxContainer">
    </div>


    <!-- =========================
         GENERATE BUTTON
    ========================== -->

    <div class="button-group">

        <button onclick="generate()">
            Generate Position Files
        </button>

    </div>


</div>


<div class="footer">
    © Khaled
</div>


<script src="POSscript.js"></script>

</body>
</html>
