<body>
  <div class="card"><div class="window"><div class="title-bar">

    <label for="client2">Client ID 2: &nbsp; &nbsp;

   <div style="display: flex; align-items: center; gap: 10px;">

<input type="date" id="expiry" style="width: 291px; margin-top: 8px;" />
