<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Position Files</title>
<link rel="stylesheet" href="style.css">
<style>
html,body{overflow:auto!important;height:auto!important;min-height:100%;width:100%!important}
.card{position:relative;width:min(94vw,480px)!important;max-width:min(94vw,480px)!important;margin:16px auto!important;box-sizing:border-box!important}
.card *{box-sizing:border-box!important;max-width:100%}
.window{width:100%!important;margin:0 0 12px!important;background:transparent!important;box-shadow:none!important;border:0!important}
.title-bar{padding:6px 10px!important;font-size:13px!important;border-radius:8px!important}
.tab-bar{display:flex!important;flex-wrap:nowrap!important;gap:3px!important}.tab{flex:1 1 0!important;width:auto!important;min-width:0!important;height:32px!important;font-size:10.5px!important;padding:0 2px!important;white-space:nowrap}
.form-row{display:flex!important;flex-direction:row!important;align-items:center!important;gap:8px!important;margin-bottom:8px!important}.form-row label{flex:0 0 100px!important;width:100px!important;margin:0!important;font-size:12px!important}.form-row input,.form-row select{flex:1!important;min-width:0!important;height:30px!important;font-size:12px!important}
#positionModeBox{display:flex!important;align-items:center!important;gap:18px!important;margin:10px 0 14px!important;padding:7px 8px!important;border:1px solid #d6d6d6!important;border-radius:7px!important;background:#fafafa!important}
#positionModeBox .mode-option{display:flex!important;align-items:center!important;gap:5px!important;font-size:12px!important;font-weight:700!important;color:#333!important;cursor:pointer!important;white-space:nowrap!important}
#positionModeBox input[type=radio]{appearance:auto!important;-webkit-appearance:auto!important;opacity:1!important;position:static!important;width:15px!important;height:15px!important;margin:0!important;max-width:none!important;cursor:pointer!important;accent-color:#2e7d32}
.expiry-disabled label{opacity:.5!important}.expiry-disabled input,.expiry-disabled select{opacity:.5!important;background:#eee!important;color:#888!important;cursor:not-allowed!important}
#checkboxContainer{display:flex!important;flex-wrap:wrap!important;gap:4px 14px!important;padding:8px!important;max-height:none!important}#checkboxContainer .checkbox-item{flex:0 0 auto;margin-bottom:2px!important}#checkboxContainer .checkbox-item label{font-size:12px!important}#checkboxContainer input[type=checkbox]{width:15px!important;height:15px!important}
#manualDrawer{display:none;position:absolute;inset:0;background:#fff;border-radius:15px;box-shadow:0 6px 22px rgba(0,0,0,.25);z-index:100;flex-direction:column;overflow:hidden}#manualDrawer.open{display:flex!important}
.manual-head{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#2e7d32;color:#fff}.manual-head strong{font-size:14px;flex:1}.manual-head button{width:auto!important;min-width:0!important;height:auto!important;margin:0!important;padding:5px 11px!important;background:#fff!important;color:#2e7d32!important;border:0!important;border-radius:5px!important;font-size:11px!important;font-weight:700!important;cursor:pointer}
.manual-body{flex:1;overflow-y:auto;padding:10px 12px;-webkit-overflow-scrolling:touch}.manual-notice{font-size:11px;color:#8a4b00;background:#fff4e0;border:1px solid #f0d3a0;border-radius:5px;padding:7px 8px;margin-bottom:10px}.manual-row{border:1px solid #ddd;border-radius:7px;padding:8px;margin-bottom:8px;background:#fafafa}.manual-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.manual-field{display:flex;flex-direction:column}.manual-field label{font-size:11px;color:#555;margin-bottom:2px}.manual-field input,.manual-field select{width:100%!important;height:29px!important;min-width:0!important;margin:0!important;font-size:12px!important;padding:3px 5px!important}.manual-foot{display:flex;justify-content:flex-end;gap:6px;margin-top:7px}.manual-foot button{width:auto!important;min-width:0!important;height:auto!important;margin:0!important;padding:4px 9px!important;font-size:11px!important;cursor:pointer}
@media(max-width:420px){#positionModeBox{gap:12px}.manual-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="card">
<div class="window"><div class="title-bar">Position Files</div></div>
<div class="tab-bar" role="tablist">
<button class="tab active" onclick="changeTab('FO',this)">FO</button>
<button class="tab" onclick="changeTab('CD',this)">CD</button>
<button class="tab" onclick="changeTab('MCX',this)">MCX</button>
<button class="tab" onclick="changeTab('NCDEX',this)">NCDEX</button>
<button class="tab" onclick="changeTab('NSECOM',this)">NSECOM</button>
</div>
<input type="hidden" id="positionType" value="FO">
<div class="form-row"><label for="client1">Client ID 1</label><input type="text" id="client1"></div>
<div class="form-row"><label for="client2">Client ID 2</label><input type="text" id="client2"></div>
<div id="positionModeBox" aria-label="Position mode">
<label class="mode-option"><input type="radio" name="positionMode" id="modeSample" value="sample" checked>Sample Positions</label>
<label class="mode-option"><input type="radio" name="positionMode" id="modeManual" value="manual">Manual Entry</label>
</div>
<div class="form-row" id="commonExpiryRow"><label for="expiry">NSE Expiry</label><input type="date" id="expiry"></div>
<div class="form-row" id="sensexBankexExpiryRow"><label for="sensexBankexExpiry">BSE Expiry</label><input type="date" id="sensexBankexExpiry"></div>
<div id="symbolExpiryContainer" style="display:none"></div>
<div class="form-row" id="additionalStrikeRow"><label for="additionalStrikes">Additional Strikes</label><input type="number" id="additionalStrikes" min="0" value="0"></div>
<div id="checkboxContainer"></div>
<div id="manualDrawer" aria-hidden="true">
<div class="manual-head"><strong>Manual Position Entry</strong><button type="button" onclick="doneManualEntry()">Done</button></div>
<div class="manual-body"><div class="manual-notice">Manual Entry ON — only the scrips entered below will be written to the position file.</div><div id="manualContainer"></div></div>
</div>
<div class="button-group"><button type="button" onclick="generate()">Generate Position Files</button></div>
</div>
<div class="footer">© Khaled</div>
<script src="POSscript.js"></script>
</body>
</html>
