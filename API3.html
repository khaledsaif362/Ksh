<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rupeeseed API Tool</title>

<style>
body { font-family: Arial; margin:0; background:#f5f7fa; }

.header {
  background:#2563eb;
  color:white;
  padding:12px;
  text-align:center;
  font-size:20px;
}

.topbar {
  padding:15px;
  background:#e0ecff;
  border-bottom:2px solid #2563eb;
  text-align:center;
}

select {
  width:320px;
  padding:10px;
  font-size:15px;
  border:2px solid #2563eb;
  border-radius:6px;
  font-weight:bold;
}

/* Split */
.main {
  display:flex;
  min-height:calc(100vh - 110px);
}

.left {
  width:50%;
  padding:15px;
}

.right {
  width:50%;
  padding:15px;
  border-left:2px solid #ddd;
  background:white;
}

/* Grid */
.grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

input {
  padding:8px;
  border:1px solid #ccc;
  border-radius:5px;
}

/* Buttons */
.btn {
  padding:8px 12px;
  margin-right:10px;
  border:none;
  background:#2563eb;
  color:white;
  border-radius:5px;
  cursor:pointer;
}

.copied { background:green !important; }

/* Preview */
.preview {
  margin-top:10px;
  border:1px solid #ddd;
  padding:12px;
  font-family:monospace;
  font-size:13px;
  white-space:pre-wrap;
  word-break:break-word;
}
</style>
</head>

<body>

<div class="header">Rupeeseed API Tool</div>

<div class="topbar">
<select id="apiSelect" onchange="loadForm()">
  <option value="">-- SELECT API --</option>
  <option value="clientAdd">CLIENT ADD</option>
  <option value="clientUpdate">CLIENT UPDATE</option>
  <option value="bankAdd">BANK DETAIL ADD</option>
  <option value="holding">HOLDING ADD/UPDATE</option>
  <option value="getBank">GET BANK OPEN</option>
</select>
</div>

<div class="main">

<!-- LEFT -->
<div class="left">
  <div id="formArea" class="grid"></div>
</div>

<!-- RIGHT -->
<div class="right">
  <button class="btn" onclick="generateJSON()">Generate JSON</button>
  <button id="copyBtn" class="btn" onclick="copyJSON()">Copy</button>

  <div id="preview" class="preview"></div>
</div>

</div>

<script>

const apiFields = {

// ✅ FULL CLIENT ADD (PDF)
clientAdd: {
entity_id:"DP001",
entity_name:"Darshan",
entity_manager_code:"RS001",
entity_manager_type:"BR",
address_line1:"",
address_line2:"",
address_line3:"",
entity_status:"E",
mobile_no:"9876543210",
landline_no:"",
entity_sub_type:"7",
user_id:"",
dob:"01/01/1990",
pan:"ABCDE1234F",
email:"test@mail.com",
pincode:"400001",
ucc_code_cap:"RS00123",
ucc_code_com:"RS00123",
settlor_code_eq:"0",
settlor_code_dr:"0",
settlor_code_cr:"0",
settlor_code_cm:"0",
password_type:"DEFAULT",
offline_allowed:"N",
exchange_allowed:"111010101111",
product_allowed:"1110101",
login_id:"DP001",
ql_profile_id:"",
risk_profile_id:"",
entity_limit:"0",
remarks1:"NA",
remarks2:"NA",
remarks3:"NA",
trade_notify_flag:"Y",
mtm_notify_flag:"Y",
dp_name:"NSDL",
dp_id:"IN123456",
ben_id:"1234567812345678",
signon_flg:"Y",
poa_flg:"Y",
edis_bo_id:"NA"
},

clientUpdate: {
entity_id:"DP001",
entity_name:"Darshan",
mobile_no:"9876543210",
email:"test@mail.com"
},

bankAdd: {
entity_id:"CL001",
account_no:"123456789",
account_type:"CAPITAL",
bank_ifsc:"SBIN0001234",
remarks:"test"
},

// ✅ FULL HOLDING (FIXED)
holding: {
client_id:"CL001",
source_type:"T1",
ISIN_Code:"IN123456",
quantity:"10",
cost_price:"100",
exchange:"NSE",
collateral_flag:"N",
collateral_percentage:"0",
collateral_quantity:"0",
ins_upd:"0"
},

getBank: {
client_id:"CL001"
}

};

let currentPreview = "";

function loadForm() {
  let api = apiSelect.value;
  let fields = apiFields[api];

  formArea.innerHTML = "";

  for (let key in fields) {
    formArea.innerHTML += `
      <input id="${key}" placeholder="${key}" value="${fields[key]}">
    `;
  }

  // AUTO PREVIEW
  if (api === "holding") {
    preview.innerText = JSON.stringify({
      client_id: fields.client_id,
      source_type: fields.source_type,
      record_list: [{
        ISIN_Code: fields.ISIN_Code,
        quantity: fields.quantity,
        cost_price: fields.cost_price,
        exchange: fields.exchange,
        collateral_flag: fields.collateral_flag,
        collateral_percentage: fields.collateral_percentage,
        collateral_quantity: fields.collateral_quantity,
        ins_upd: fields.ins_upd
      }]
    }, null, 2);
  } else {
    preview.innerText = JSON.stringify(fields, null, 2);
  }

  currentPreview = preview.innerText;
}

function generateJSON() {
  let api = apiSelect.value;
  let base = apiFields[api];

  if (api === "holding") {
    let obj = {
      client_id: client_id.value || base.client_id,
      source_type: source_type.value || base.source_type,
      record_list: [{
        ISIN_Code: ISIN_Code.value || base.ISIN_Code,
        quantity: quantity.value || base.quantity,
        cost_price: cost_price.value || base.cost_price,
        exchange: exchange.value || base.exchange,
        collateral_flag: collateral_flag.value || base.collateral_flag,
        collateral_percentage: collateral_percentage.value || base.collateral_percentage,
        collateral_quantity: collateral_quantity.value || base.collateral_quantity,
        ins_upd: ins_upd.value || base.ins_upd
      }]
    };

    currentPreview = JSON.stringify(obj, null, 2);
    preview.innerText = currentPreview;
    return;
  }

  let obj = {};
  for (let key in base) {
    obj[key] = document.getElementById(key).value || base[key];
  }

  currentPreview = JSON.stringify(obj, null, 2);
  preview.innerText = currentPreview;
}

function copyJSON() {
  navigator.clipboard.writeText(currentPreview);

  copyBtn.innerText = "Copied ✓";
  copyBtn.classList.add("copied");

  setTimeout(() => {
    copyBtn.innerText = "Copy";
    copyBtn.classList.remove("copied");
  }, 2000);
}

</script>

</body>
</html>
