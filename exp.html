<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Exposure Calculator</title>

<style>

body{
  font-family:"Segoe UI", Arial, sans-serif;
  margin:0;
  background:#f5f5f5;
  padding-top:60px;   /* 👈 TOP SPACE (2–3 lines) */
}

/* ===== HEADER ===== */

.header{
  background:#2e7d32;
  color:white;
  padding:18px 28px;
  font-size:22px;
  font-weight:600;
}

/* ===== MAIN AREA ===== */

.container{
  padding:30px;
}

/* ===== ENTRY BAR ===== */

.entry{
  display:flex;
  gap:12px;
  margin-bottom:25px;
}

select,input{
  padding:11px;
  font-size:15px;
  border-radius:6px;
  border:1px solid #ccc;
  flex:1;
}

button{
  padding:11px 20px;
  font-size:15px;
  border:none;
  border-radius:6px;
  background:#2e7d32;
  color:white;
  cursor:pointer;
  font-weight:600;
}

button:hover{
  background:#1b5e20;
}

/* ===== PREVIEW CARD ===== */

.preview-card{
  background:white;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,0.12);
  overflow:hidden;
}

.preview-header{
  background:#e8f5e9;
  padding:14px 18px;
  font-size:18px;
  font-weight:600;
  color:#2e7d32;
}

/* ===== TABLE ===== */

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  border:1px solid #e0e0e0;
  padding:10px;
  text-align:center;
  vertical-align:top;
}

th{
  background:#2e7d32;
  color:white;
}

tr:nth-child(even){
  background:#fafafa;
}

/* ===== TOTAL ROW ===== */

tfoot td{
  font-weight:700;
  background:#f1f8e9;
}

/* REMOVE BUTTON */

.remove-btn{
  background:#c62828;
  padding:6px 12px;
  font-size:13px;
  border-radius:4px;
  border:none;
  color:white;
  cursor:pointer;
}

</style>

</head>

<body>

<div class="header">Exposure Calculator</div>

<div class="container">

<!-- ===== ENTRY ===== -->

<div class="entry">

<select id="type" onchange="changeType()">
  <option value="future">Future</option>
  <option value="option">Option</option>
</select>

<input id="v1" type="number" placeholder="1st Contract">
<input id="v2" type="number" placeholder="2nd Contract">

<button onclick="submitData()">Submit</button>

</div>

<!-- ===== PREVIEW ===== -->

<div class="preview-card">

<div class="preview-header">Preview</div>

<table id="calcTable">

<thead>
<tr>
<th>Type</th>
<th>Calculations</th>
<th>Exposure</th>
<th>Remove</th>
</tr>
</thead>

<tbody></tbody>

<tfoot>
<tr>
<td colspan="2" style="text-align:right;">Total Exposure</td>
<td id="total">0</td>
<td></td>
</tr>
</tfoot>

</table>

</div>

</div>

<script>

let total = 0;

const typeEl = document.getElementById("type");
const v1El = document.getElementById("v1");
const v2El = document.getElementById("v2");

/* ===== CHANGE TYPE ===== */

function changeType(){

  if(typeEl.value === "future"){
    v1El.placeholder = "1st Contract";
    v2El.placeholder = "2nd Contract";
  }else{
    v1El.placeholder = "Contract Value";
    v2El.placeholder = "Exp %";
  }
}

/* ===== SUBMIT ENTRY ===== */

function submitData(){

  const type = typeEl.value;
  const A = Number(v1El.value) || 0;
  const B = Number(v2El.value) || 0;

  if(A === 0 && B === 0) return;

  let exposure = 0;
  let steps = "";

  // ===== FUTURE SPREAD =====
  if(type === "future"){

    const gross = A + B;
    const net = Math.abs(A - B);
    const spreadPortion = (gross - net) / 2;

    const spreadExposure = spreadPortion * 0.02 * 0.34;
    const balanceExposure = net * 0.02;

    exposure = spreadExposure + balanceExposure;

    steps = `
1) 1st Contract = ${A}<br>
2) 2nd Contract = ${B}<br><br>

3) Gross Spread = ${A} + ${B} = ${gross}<br>
4) Net Spread = ${A} − ${B} = ${net}<br><br>

5) Gross Exp = (${gross} − ${net}) / 2 = ${spreadPortion}<br>
   <br>&nbsp;&nbsp

   = ${spreadPortion} × 2% × 34% = <b>${spreadExposure.toFixed(2)}</b><br><br>

6) Net Exp = ${net}<br><br>&nbsp&nbsp

   = ${net} × 2% = <b>${balanceExposure.toFixed(2)}</b><br><br>

<b>Final Exposure = ${spreadExposure.toFixed(2)} + ${balanceExposure.toFixed(2)} = ${exposure.toFixed(2)}</b>
`;
  }

  // ===== OPTION =====
  else{

    exposure = A * B / 100;

    steps = `
1) Contract Value = ${A}<br>
2) Exposure % = ${B}%<br><br>

Exposure = Contract × Exposure% / 100<br>
         = ${A} × ${B} / 100<br>
         = <b>${exposure.toFixed(2)}</b>
`;
  }

  total += exposure;

  const tbody = document.querySelector("#calcTable tbody");

  const row = tbody.insertRow();

  row.innerHTML = `
    <td>${type.toUpperCase()}</td>
    <td style="text-align:left">${steps}</td>
    <td>${exposure.toFixed(2)}</td>
    <td><button class="remove-btn" onclick="removeRow(this, ${exposure})">X</button></td>
  `;

  document.getElementById("total").textContent =
    total.toFixed(2);

  // Clear inputs
  v1El.value = "";
  v2El.value = "";
  v1El.focus();
}

/* ===== REMOVE ROW ===== */

function removeRow(btn, exposure){

  const row = btn.parentElement.parentElement;

  row.remove();

  total -= exposure;

  document.getElementById("total").textContent =
    total.toFixed(2);
}

</script>

</body>
</html>
