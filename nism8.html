<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NISM Series VIII: 100 Q&A Master</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #f0f2f5; margin: 0; padding: 15px; color: #1e293b; }
        .wrapper { max-width: 650px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        #welcome-screen { text-align: center; padding: 40px 20px; }
        input[type="text"] { width: 80%; padding: 12px; margin: 20px 0; border: 2px solid #2563eb; border-radius: 8px; font-size: 16px; }
        .start-btn { padding: 12px 30px; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        #quiz-container { display: none; }
        .sticky-stats { position: sticky; top: 10px; background: #2563eb; color: white; padding: 12px; border-radius: 8px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; z-index: 100; font-weight: bold; text-align: center; }
        .timer { font-size: 1.2rem; color: #fde047; }
        .q-box { border: 1px solid #e2e8f0; padding: 15px; margin-bottom: 20px; border-radius: 10px; }
        .btn { display: block; width: 100%; text-align: left; padding: 12px; margin: 8px 0; border: 1px solid #cbd5e1; border-radius: 6px; background: white; cursor: pointer; font-size: 14px; }
        .correct { background: #dcfce7 !important; border-color: #16a34a !important; color: #166534; font-weight: bold; }
        .wrong { background: #fee2e2 !important; border-color: #dc2626 !important; color: #991b1b; }
        .expl { display: none; margin-top: 10px; padding: 12px; background: #eff6ff; border-left: 4px solid #2563eb; font-size: 13px; }
        #final-res { display: none; text-align: center; padding: 30px; }
        .pass { color: #16a34a; font-size: 2rem; font-weight: bold; }
        .fail { color: #dc2626; font-size: 2rem; font-weight: bold; }
        #finish-btn { width: 100%; padding: 15px; background: #16a34a; color: white; border: none; border-radius: 8px; font-size: 1.2rem; font-weight: bold; cursor: pointer; }
        .history { margin-top: 20px; font-size: 0.9rem; color: #64748b; background: #f8fafc; padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>
<div class="wrapper">
    <div id="welcome-screen">
        <h2>NISM Series VIII: Equity Derivatives</h2>
        <p>Please enter your name to begin the 100-question mock exam.</p>
        <input type="text" id="candidateName" placeholder="Enter Full Name" autocomplete="off">
        <br>
        <button class="start-btn" onclick="startExam()">Start Exam</button>
        <div id="history-box" class="history" style="display:none;"></div>
    </div>

    <div id="quiz-container">
        <div class="sticky-stats">
            <div style="display:flex; justify-content: space-around;">
                <span>Score: <span id="score">0.00</span>/100</span>
                <span>Progress: <span id="prog">0</span>/100</span>
            </div>
            <div class="timer">Time Remaining: <span id="clock">02:00:00</span></div>
            <div id="user-display" style="font-size: 0.8rem; opacity: 0.9;"></div>
        </div>
        <div id="quiz-root"></div>
        <button id="finish-btn" onclick="endExam()">Finish & Show Result</button>
    </div>

    <div id="final-res">
        <h1 id="status"></h1>
        <p id="total-score" style="font-size: 1.5rem;"></p>
        <p id="breakdown" style="color: #64748b;"></p>
        <button onclick="location.reload()" style="margin-top: 20px; padding: 10px 20px;">Restart Exam</button>
    </div>
</div>

<script>
let userName = "";
let rawScore = 0, wrongCount = 0, answered = 0, timeLeft = 7200, timerInt;

// Load History on Page Load
window.onload = () => {
    const saved = localStorage.getItem('nism_history');
    if(saved) {
        const data = JSON.parse(saved);
        document.getElementById('history-box').style.display = 'block';
        document.getElementById('history-box').innerHTML = `<strong>Last Attempt:</strong> ${data.name} - ${data.score}/100<br><strong>Highest Score:</strong> ${data.highScore}/100`;
    }
};

function startExam() {
    userName = document.getElementById('candidateName').value.trim();
    if(!userName) { alert("Please enter your name to continue"); return; }
    
    document.getElementById('welcome-screen').style.display = 'none';
    document.getElementById('quiz-container').style.display = 'block';
    document.getElementById('user-display').innerText = "Candidate: " + userName;
    
    render();
    startTimer();
}

function startTimer() {
    timerInt = setInterval(() => {
        timeLeft--;
        let h=Math.floor(timeLeft/3600), m=Math.floor((timeLeft%3600)/60), s=timeLeft%60;
        document.getElementById('clock').innerText = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        if(timeLeft<=0) { clearInterval(timerInt); endExam(); }
    }, 1000);
}

    {q:"Long Straddle expectation:", o:["Quiet market","High Volatility","Slow rise","Market crash"], c:1, e:"Needs a big move in either direction."},

function render() {
    const root = document.getElementById('quiz-root');
    qData.forEach((it, i) => {
        const d = document.createElement('div');
        d.className = 'q-box';
        d.innerHTML = `<p><strong>${i+1}. ${it.q}</strong></p>` + 
            it.o.map((o, oi) => `<button class="btn q${i}" onclick="check(${i},${oi})">${o}</button>`).join('') +
            `<div id="e${i}" class="expl"><strong>Explanation:</strong> ${it.e}</div>`;
        root.appendChild(d);
    });
}

function check(qi, oi) {
    const bs = document.querySelectorAll(`.q${qi}`);
    if (bs[0].disabled) return;
    const c = qData[qi].c;
    if (oi === c) { bs[oi].classList.add('correct'); rawScore++; }
    else { bs[oi].classList.add('wrong'); bs[c].classList.add('correct'); wrongCount++; }
    answered++;
    document.getElementById('score').innerText = (rawScore - (wrongCount * 0.25)).toFixed(2);
    document.getElementById('prog').innerText = answered;
    Array.from(bs).forEach(b => b.disabled = true);
    document.getElementById(`e${qi}`).style.display = 'block';
}

function endExam() {
    clearInterval(timerInt); window.scrollTo(0,0);
    document.getElementById('quiz-container').style.display = 'none';
    const res = document.getElementById('final-res'); res.style.display = 'block';
    
    let f = parseFloat((rawScore - (wrongCount * 0.25)).toFixed(2));
    
    // Save to LocalStorage
    const saved = localStorage.getItem('nism_history');
    let high = f;
    if(saved) {
        const oldData = JSON.parse(saved);
        high = Math.max(f, oldData.highScore);
    }
    localStorage.setItem('nism_history', JSON.stringify({name: userName, score: f, highScore: high}));

    const st = document.getElementById('status');
    st.innerText = f>=60?`Congratulation, ${userName}! PASS 🎉`:`Sorry, ${userName}, FAIL ❌`; 
    st.className = f>=60?"pass":"fail";
    document.getElementById('total-score').innerText = `Final Marks: ${f}/100`;
    document.getElementById('breakdown').innerText = `Correct: ${rawScore} | Wrong: ${wrongCount} | Penalty: -${(wrongCount*0.25).toFixed(2)}`;
}
</script>
</body>
</html>
