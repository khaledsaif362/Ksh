<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSV 4x Row Generator (PRODUCT & BUY/SELL)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 16px;
    }
    h1 {
      font-size: 18px;
      margin-bottom: 8px;
    }
    .controls {
      margin-bottom: 12px;
    }
    input[type="file"] {
      margin-right: 8px;
    }
    button {
      padding: 6px 10px;
      margin: 4px 4px 4px 0;
      cursor: pointer;
    }
    #info {
      margin-top: 8px;
      font-size: 13px;
    }
    .table-wrapper {
      margin-top: 12px;
      max-height: 60vh;
      overflow: auto;
      border: 1px solid #ccc;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 12px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 4px 6px;
      white-space: nowrap;
      text-align: left;
    }
    th {
      background: #f2f2f2;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

<h1>CSV 4x Row Generator (PRODUCT & BUY/SELL)</h1>
<div class="controls">
  <input type="file" id="fileInput" accept=".csv">
  <button id="generateBtn">Upload & Generate 4x Rows</button>
  <button id="downloadBtn" disabled>Download New CSV</button>
</div>

<div id="info"></div>

<div class="table-wrapper hidden" id="tableWrapper">
  <table id="previewTable">
    <thead id="previewHead"></thead>
    <tbody id="previewBody"></tbody>
  </table>
</div>

<script>
  const fileInput    = document.getElementById('fileInput');
  const generateBtn  = document.getElementById('generateBtn');
  const downloadBtn  = document.getElementById('downloadBtn');
  const infoDiv      = document.getElementById('info');
  const tableWrapper = document.getElementById('tableWrapper');
  const previewHead  = document.getElementById('previewHead');
  const previewBody  = document.getElementById('previewBody');

  let headers       = [];
  let generatedRows = [];

  // Simple CSV parser (no commas inside values assumed)
  function parseCSV(text) {
    const lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
    const out = [];
    for (let line of lines) {
      if (!line.trim()) continue;
      out.push(line.split(','));
    }
    return out;
  }

  function clearPreviewDOM() {
    previewHead.innerHTML = '';
    previewBody.innerHTML = '';
    tableWrapper.classList.add('hidden');
  }

  function buildPreview() {
    clearPreviewDOM();

    if (!headers.length || !generatedRows.length) {
      infoDiv.textContent = 'No data to preview.';
      downloadBtn.disabled = true;
      return;
    }

    // Header row
    const trHead = document.createElement('tr');
    headers.forEach(h => {
      const th = document.createElement('th');
      th.textContent = h;
      trHead.appendChild(th);
    });
    previewHead.appendChild(trHead);

    // Data rows
    generatedRows.forEach(row => {
      const tr = document.createElement('tr');
      headers.forEach((_, idx) => {
        const td = document.createElement('td');
        td.textContent = row[idx] !== undefined ? row[idx] : '';
        tr.appendChild(td);
      });
      previewBody.appendChild(tr);
    });

    tableWrapper.classList.remove('hidden');
    downloadBtn.disabled = false;
  }

  // Find exact column by name (case-insensitive, trimmed)
  function findExactColumnIndex(headers, targetName) {
    const lowerTarget = targetName.toLowerCase();
    for (let i = 0; i < headers.length; i++) {
      const h = (headers[i] || '').toString().trim().toLowerCase();
      if (h === lowerTarget) return i;
    }
    return -1;
  }

  generateBtn.addEventListener('click', () => {
    const file = fileInput.files && fileInput.files[0];
    if (!file) {
      alert('Please choose a CSV file first.');
      return;
    }

    const reader = new FileReader();
    reader.onload = function(e) {
      const text = e.target.result;
      const parsed = parseCSV(text);

      if (!parsed.length) {
        infoDiv.textContent = 'CSV is empty or could not be parsed.';
        headers = [];
        generatedRows = [];
        clearPreviewDOM();
        downloadBtn.disabled = true;
        return;
      }

      headers = parsed[0];
      const dataRows = parsed
        .slice(1)
        .filter(r => r.some(v => String(v).trim() !== ''));

      if (!dataRows.length) {
        infoDiv.textContent = 'No data rows found in CSV.';
        generatedRows = [];
        clearPreviewDOM();
        downloadBtn.disabled = true;
        return;
      }

      // Here we expect columns named exactly "PRODUCT" and "BUY/SELL" (any case)
      const prodIdx = findExactColumnIndex(headers, 'PRODUCT');
      const sideIdx = findExactColumnIndex(headers, 'BUY/SELL');

      if (prodIdx === -1 || sideIdx === -1) {
        infoDiv.textContent =
          'Did not find columns "PRODUCT" and/or "BUY/SELL" in header. ' +
          'Please check the first row of your CSV.';
        generatedRows = [];
        clearPreviewDOM();
        downloadBtn.disabled = true;
        return;
      }

      // Generate 4x rows
      generatedRows = [];
      const combos = [
        ['MARGIN',   'BUY'],
        ['MARGIN',   'SELL'],
        ['INTRADAY', 'BUY'],
        ['INTRADAY', 'SELL']
      ];

      dataRows.forEach(row => {
        combos.forEach(([prod, side]) => {
          const newRow = row.slice();    // copy
          newRow[prodIdx] = prod;        // overwrite PRODUCT
          newRow[sideIdx] = side;        // overwrite BUY/SELL
          generatedRows.push(newRow);
        });
      });

      infoDiv.textContent =
        `Original rows: ${dataRows.length}, Generated rows: ${generatedRows.length}. ` +
        `Using columns "${headers[prodIdx]}" for Product and "${headers[sideIdx]}" for Buy/Sell.`;

      buildPreview();
    };

    reader.onerror = function() {
      infoDiv.textContent = 'Error reading file.';
    };

    reader.readAsText(file);
  });

  downloadBtn.addEventListener('click', () => {
    if (!headers.length || !generatedRows.length) {
      alert('Nothing to download.');
      return;
    }

    const rowsForCsv = [];
    rowsForCsv.push(headers);  // same header as original
    generatedRows.forEach(r => rowsForCsv.push(r));

    let csvContent = '';
    rowsForCsv.forEach(cols => {
      const line = cols
        .map(val => {
          const v = val == null ? '' : String(val);
          const escaped = v.replace(/"/g, '""');
          return `"${escaped}"`;
        })
        .join(',');
      csvContent += line + '\r\n';
    });

    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = 'generated_4x_rows.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });
</script>

</body>
</html>
