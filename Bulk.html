<!DOCTYPE html>
<html>
<head>
  <title>RS</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
    }
    input[type="text"],
    input[type="number"],
    input[type="file"] {
      width: 250px;
      padding: 8px;
    }
    .radio-group {
      display: flex;
      gap: 20px;
    }
    button {
      padding: 10px 20px;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h2>NSE EQ</h2>

  <div class="form-group">
    <label>Upload NSE Bhavcopy</label>
    <input type="file" id="fileInput" accept=".csv,.txt">
  </div>

  <div class="form-group">
    <label>Client ID:</label>
    <input type="text" id="clientInput">
  </div>

  <div class="form-group">
    <label></label>
    <div class="radio-group">
      <label><input type="radio" name="orderType" value="BUY"> Buy</label>
      <label><input type="radio" name="orderType" value="SELL"> Sell</label>
    </div>
  </div>

  <div class="form-group">
    <label>Records:</label>
    <input type="number" id="countInput" value="10" min="1">
  </div>

  <button onclick="generateCSV()">Generate</button>

  <script>
    function generateCSV() {
      const file = document.getElementById('fileInput').files[0];
      const client = document.getElementById('clientInput').value.trim();
      const orderType = document.querySelector('input[name="orderType"]:checked');
      const count = parseInt(document.getElementById('countInput').value);

      if (!file) return alert("Please upload a file.");
      if (!client) return alert("Enter Client ID.");
      if (!orderType) return alert("Select Buy or Sell.");

      const reader = new FileReader();
      reader.onload = function (e) {
        const lines = e.target.result.split('\n').map(line => line.trim()).filter(Boolean);
        const headers = lines[0].split(',').map(h => h.trim());
        
        const symbolIndex = headers.indexOf("TckrSymb");
        const sctySrsIndex = headers.indexOf("SctySrs");
        const priceIndex = headers.indexOf("OpnPric");
        const tokenIndex = headers.indexOf("FinInstrmId");

        if (symbolIndex === -1 || priceIndex === -1 || sctySrsIndex === -1 || tokenIndex === -1) {
          alert("CSV must contain headers: TckrSymb, SctySrs, OpnPric, FinInstrmId");
          return;
        }

        const symbolMap = new Map();

        for (let i = 1; i < lines.length; i++) {
          const parts = lines[i].split(',');
          const sym = parts[symbolIndex]?.trim().toUpperCase();
          const series = parts[sctySrsIndex]?.trim().toUpperCase();
          const price = parts[priceIndex]?.trim();
          const token = parts[tokenIndex]?.trim();

          if (series === "EQ" && sym && !symbolMap.has(sym)) {
            symbolMap.set(sym, { price, token });
          }
        }

        const entries = Array.from(symbolMap.entries());
        const finalCount = Math.min(count, entries.length);
        let content = ",Exch,EXCH_SEG,SegmentCode,Symbol,ClientID,Buy/Sell,Token,Product,Qty,Price,OrdType,Trigger Price,DQty,Val,Pro/Cli,Participant ID,LTP\n";

        for (let i = 0; i < finalCount; i++) {
          const [sym, data] = entries[i];
          const price = data.price;
          const token = data.token;
          content += `,NSE,NSEE,E,${sym}-EQ,${client},${orderType.value},${token},CNC,1,${price},Limit,0,0,DAY,C,,${price}\n`;
        }

        const blob = new Blob([content], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", "nse_output.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      reader.readAsText(file);
    }
  </script>

</body>
</html>
