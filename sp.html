<!DOCTYPE html>
<html>
<head>
  <title>Supabase Test</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>

<body>

<h2>Supabase Test</h2>

<input id="name" placeholder="Name">
<input id="email" placeholder="Email">

<br><br>

<button onclick="saveData()">Save</button>
<button onclick="loadData()">Load</button>

<div id="output"></div>

<script>

// ✅ Fix for mobile browser
window.process = { env: {} };

// ✅ Correct Supabase init
const { createClient } = window.supabase;

const supabase = createClient(
  "https://hnmztjkxyihientgvkqi.supabase.co",
  "sb_publishable_ke0D5Y9O11n2v08uDSnnNA_sxEdyuDI"
);

// ✅ SAVE DATA
async function saveData() {
  try {
    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;

    if (!name || !email) {
      alert("Enter name & email");
      return;
    }

    const { error } = await supabase
      .from("users")
      .insert([{ name, email }]);

    if (error) throw error;

    alert("Saved successfully ✅");

  } catch (err) {
    console.error(err);
    alert("Error: " + err.message);
  }
}

// ✅ LOAD DATA
async function loadData() {
  try {
    const { data, error } = await supabase
      .from("users")
      .select("*");

    if (error) throw error;

    if (!data.length) {
      document.getElementById("output").innerHTML = "No data found";
      return;
    }

    document.getElementById("output").innerHTML =
      data.map(d => `<p>${d.name} - ${d.email}</p>`).join("");

  } catch (err) {
    console.error(err);
    alert("Error: " + err.message);
  }
}

</script>

</body>
</html>
